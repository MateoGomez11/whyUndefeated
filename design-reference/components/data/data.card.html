<!-- @dsCard group="Components" viewport="700x360" name="Data (ThreatBadge, StatCounter)" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../preview-runtime.js"></script>
</head>
<body style="margin:0;background:var(--bg-0);padding:24px;font-family:var(--font-sans)">
<div id="root"></div>
<script>
var h = React.createElement;
var ThreatBadge = DS.ThreatBadge, StatCounter = DS.StatCounter;
var demo = h('div', {style:{display:'flex',flexDirection:'column',gap:24}},
  h('div', {style:{display:'flex',gap:10,flexWrap:'wrap'}},
    h(ThreatBadge, {tier:'high'}),
    h(ThreatBadge, {tier:'medium'}),
    h(ThreatBadge, {tier:'low'}),
    h(ThreatBadge, {tier:'high', size:'sm'})
  ),
  h('div', {style:{display:'flex',gap:40}},
    h(StatCounter, {value:3, label:'High threat'}),
    h(StatCounter, {value:340, suffix:'M', label:'Monthly active users'})
  )
);
ReactDOM.createRoot(document.getElementById('root')).render(demo);
</script>
</body>
</html>
