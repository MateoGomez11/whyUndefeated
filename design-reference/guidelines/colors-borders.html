<!-- @dsCard group="Colors" viewport="700x140" subtitle="Border levels" name="Borders" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;padding:16px;background:var(--bg-0)">
  <div style="width:150px;height:80px;background:var(--bg-1);border:1px solid var(--border-subtle);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary)">border-subtle</div>
  <div style="width:150px;height:80px;background:var(--bg-1);border:1px solid var(--border-default);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary)">border-default</div>
  <div style="width:150px;height:80px;background:var(--bg-1);border:1px solid var(--border-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary)">border-strong</div>
</div>
