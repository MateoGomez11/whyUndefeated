<!-- @dsCard group="Brand" viewport="700x160" subtitle="Hover/active glow — no heavy drop shadows" name="Glow states" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16px;padding:16px;background:var(--bg-0)">
  <div style="width:140px;height:90px;background:var(--bg-2);border:1px solid var(--border-subtle);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary)">rest</div>
  <div style="width:140px;height:90px;background:var(--bg-2);border:1px solid var(--brand-500);border-radius:4px;box-shadow:var(--glow-hover);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--brand-300)">hover</div>
  <div style="width:140px;height:90px;background:var(--bg-2);border:1px solid var(--brand-400);border-radius:4px;box-shadow:var(--glow-active);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--brand-300)">active</div>
</div>
