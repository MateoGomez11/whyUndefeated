<!-- @dsCard group="Colors" viewport="700x160" subtitle="Independent verdict color system — never decorative elsewhere" name="Threat semantics" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;padding:16px;background:var(--bg-0);font-family:var(--font-mono)">
  <div style="padding:8px 14px;border-radius:3px;background:var(--threat-high-bg);border:1px solid var(--threat-high-border);color:var(--threat-high);font-size:12px;font-weight:700;box-shadow:0 0 12px var(--threat-high-glow)">HIGH THREAT</div>
  <div style="padding:8px 14px;border-radius:3px;background:var(--threat-medium-bg);border:1px solid var(--threat-medium-border);color:var(--threat-medium);font-size:12px;font-weight:700;box-shadow:0 0 12px var(--threat-medium-glow)">MEDIUM THREAT</div>
  <div style="padding:8px 14px;border-radius:3px;background:var(--threat-low-bg);border:1px solid var(--threat-low-border);color:var(--threat-low);font-size:12px;font-weight:700;box-shadow:0 0 12px var(--threat-low-glow)">LOW THREAT</div>
</div>
